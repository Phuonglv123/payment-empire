services:
  payment-empire:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: payment-empire
    restart: unless-stopped
    ports:
      - "3002:3002"
    environment:
      - NODE_ENV=production
      - PORT=3002
      - HOSTNAME=0.0.0.0
      # Add your environment variables here
      # - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL}
      # - API_SECRET=${API_SECRET}
    networks:
      - payment-network
    # Memory limits to prevent OOM crashes
    mem_limit: 512m
    memswap_limit: 512m
    # Health check using curl (more reliable)
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:3002/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    # Logging configuration to prevent disk fill
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks:
  payment-network:
    driver: bridge
